<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Digital 7 Kebiasaan Anak Indonesia Hebat</title>
  <meta name="description" content="Aplikasi pemantauan dan jurnal digital 7 kebiasaan positif untuk anak Indonesia hebat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Mode Badge (Preview / Real) -->
  <div id="app-badge" class="app-mode-badge" style="display: none;">
    <span class="pulse-dot"></span>
    <span id="app-badge-text">Mode Simulasi (Data Uji)</span>
    <button id="btn-toggle-demo-users" title="Beralih Akun Cepat" class="btn-badge-action">Ganti Peran</button>
  </div>

  <!-- Modal Beralih Akun Cepat (Untuk Pengujian Desain) -->
  <div id="demo-user-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Pilih Peran Simulasi</h3>
        <button class="btn-close-modal" id="btn-close-demo-modal">&times;</button>
      </div>
      <div class="modal-body">
        <p class="text-muted">Pilih pengguna simulasi untuk menguji antarmuka langsung sesuai mockup PRD:</p>
        <div class="role-switcher-grid">
          <button class="role-select-card" data-role="STUDENT">
            <div class="role-icon student-bg">🎒</div>
            <div class="role-meta">
              <strong>Andi Saputra</strong>
              <span>Siswa (Kelas 5A)</span>
            </div>
          </button>
          <button class="role-select-card" data-role="TEACHER">
            <div class="role-icon teacher-bg">👩‍🏫</div>
            <div class="role-meta">
              <strong>Bu Siti Rahayu</strong>
              <span>Guru (Kelas 5A)</span>
            </div>
          </button>
          <button class="role-select-card" data-role="ADMIN">
            <div class="role-icon admin-bg">🏛️</div>
            <div class="role-meta">
              <strong>Admin Sekolah</strong>
              <span>Administrator</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Application Wrapper -->
  <div id="app" class="app-root">
    <!-- Konten halaman dinamis dimuat via JavaScript -->
    <div class="app-loader">
      <div class="spinner"></div>
      <p>Memuat Jurnal Digital 7 Kebiasaan...</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views/studentView.js"></script>
  <script src="js/views/teacherView.js"></script>
  <script src="js/views/adminView.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
